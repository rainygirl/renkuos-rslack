<!DOCTYPE html>
<!--
  R Slack's sign-in step. RSlack.sh opens this page with the
  auth.loginMagicBulk URL after the "#".

  The session cookies Slack sets there count only from a top-level
  navigation: from an iframe or a fetch() they are cross-site and the
  browser drops them. So the call goes in a window of its own, and this
  window moves on to the client once that one has had time to load. Its
  answer cannot be read from here (it is another origin), so a refused
  token shows up as Slack's own sign-in page in the client.
-->
<html>
<head>
<meta charset="utf-8">
<title>R Slack</title>
<style>
	html, body {
		height: 100%;
		margin: 0;
		background: #4a154b;
		color: #ffffff;
		font: 16px sans-serif;
	}
	body {
		display: flex;
		align-items: center;
		justify-content: center;
	}
</style>
</head>
<body>
<p id="message">Signing in to Slack&hellip;</p>
<script>
(function () {
	var client = "https://app.slack.com/client";
	var api = decodeURIComponent(location.hash.slice(1));
	// Only Slack's own sign-in call, whatever is put after the "#".
	var allowed = /^https:\/\/([a-z0-9-]+\.)*slack\.com\/api\/auth\.loginMagicBulk\?magic_tokens=z-app-[A-Z0-9]+-[A-Za-z0-9._-]+&ssb=1$/;
	if (!allowed.test(api)) {
		location.replace(client);
		return;
	}
	history.replaceState(null, "", location.pathname);

	var popup = window.open(api, "rslack-sign-in", "width=320,height=200");
	if (!popup) {
		// No second window: make the call here. The cookies are set all the
		// same; the client opens on the next start.
		location.replace(api);
		return;
	}
	// The VAIO P takes a few seconds for the request alone.
	setTimeout(function () {
		try {
			popup.close();
		} catch (e) {
		}
		location.replace(client);
	}, 8000);
})();
</script>
</body>
</html>
